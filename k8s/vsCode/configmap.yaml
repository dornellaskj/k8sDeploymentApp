apiVersion: v1
kind: ConfigMap
metadata:
  name: vscode-remote-config
data:
  sshd_config: |
    Port 22
    PermitRootLogin yes
    PasswordAuthentication yes
    PubkeyAuthentication yes
    ChallengeResponseAuthentication no
    UsePAM yes
    X11Forwarding no
    Subsystem sftp /usr/lib/openssh/sftp-server
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    for i in 1 2 3 4 5; do
      apt-get update && break
      echo "apt-get update failed (attempt $i/5), retrying in 5s..." >&2
      sleep 5
    done
    apt-get install -y --no-install-recommends \
      openssh-server sudo git curl ca-certificates \
      build-essential python3 python3-pip
    rm -rf /var/lib/apt/lists/*

    if ! id coder >/dev/null 2>&1; then
      useradd -m -s /bin/bash -G sudo coder
      passwd -l coder
      echo "coder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/coder
    fi
    # kubelet pre-creates /home/coder (as root) to host the PVC mount, so useradd -m
    # finds it already existing and leaves ownership as root:root - fix it explicitly here.
    chown coder:coder /home/coder

    mkdir -p /home/coder/.ssh
    cp /etc/vscode-remote-ssh/authorized_keys /home/coder/.ssh/authorized_keys
    chmod 700 /home/coder/.ssh
    chmod 600 /home/coder/.ssh/authorized_keys
    chown -R coder:coder /home/coder/.ssh

    cp /etc/vscode-remote/sshd_config /etc/ssh/sshd_config
    ssh-keygen -A
    mkdir -p /run/sshd

    exec /usr/sbin/sshd -D -e
