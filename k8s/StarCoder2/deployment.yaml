apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: kevin-ubuntu
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
          - containerPort: 11434
        resources:
          requests:
            cpu: "4"
            memory: "20Gi"
          limits:
            cpu: "4"
            memory: "20Gi"
            nvidia.com/gpu: 2
        env:
          - name: OLLAMA_CONTEXT_LENGTH
            value: "8192"
          # Split the model across both GPUs instead of trying to fit on one
          - name: OLLAMA_SCHED_SPREAD
            value: "1"
          # Reduce KV cache memory
          - name: OLLAMA_FLASH_ATTENTION
            value: "1"
          - name: OLLAMA_KV_CACHE_TYPE
            value: "q8_0"
          # Expose both GPUs to the container runtime layer
          - name: NVIDIA_VISIBLE_DEVICES
            value: "all"
          # Swap the indices: This forces Ollama to load and process on the 5060 Ti first
          - name: CUDA_VISIBLE_DEVICES
            value: "1,0"
        volumeMounts:
          - name: models
            mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: localai-models-pvc
