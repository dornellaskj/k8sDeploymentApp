apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: kevin-ubuntu
      containers:
      - name: ollama
        image: ollama/ollama:latest
        env:
        - name: OLLAMA_NUM_CTX
          value: "262144"
        ports:
          - containerPort: 11434
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
          - name: models
            mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: localai-models-pvc
