apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args:
          - "--model=bigcode/starcoder2-7b"
          - "--host=0.0.0.0"
        ports:
          - containerPort: 8000
        env:
          - name: HF_HOME
            value: /root/.cache/huggingface
        volumeMounts:
          - name: hf-cache
            mountPath: /root/.cache/huggingface
      volumes:
        - name: hf-cache
          emptyDir: {}
#------Service
apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  type: LoadBalancer
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000