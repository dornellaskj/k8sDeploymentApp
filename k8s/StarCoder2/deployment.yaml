apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localai
  template:
    metadata:
      labels:
        app: localai
    spec:
      nodeSelector:
        kubernetes.io/hostname: kevin-ubuntu
      containers:
      - name: localai
        image: quay.io/go-skynet/local-ai:master-cublas-cuda12
        env:
          - name: MODELS_PATH
            value: /models
        ports:
          - containerPort: 8080
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
          - name: models
            mountPath: /models
      volumes:
        - name: models
          emptyDir: {}