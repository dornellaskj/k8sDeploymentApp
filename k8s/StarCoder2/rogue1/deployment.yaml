apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-rogue1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-rogue1
  template:
    metadata:
      labels:
        app: ollama-rogue1
    spec:
      nodeSelector:
        db-node: "true"
      tolerations:
      - key: "db-only"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
          - containerPort: 11434
        resources:
          requests:
            cpu: "1000m"
            memory: "4Gi"
          limits:
            cpu: "2000m"
            memory: "8Gi"
            nvidia.com/gpu: 1
        env:
          - name: num_ctx
            value: "8192"
          # Expose both GPUs to the container runtime layer
          - name: NVIDIA_VISIBLE_DEVICES
            value: "all"
          
          - name: CUDA_VISIBLE_DEVICES
            value: "0"
        volumeMounts:
          - name: models
            mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-pvc-rogue1
