# The Initializer runs database migrations and seeds the initial admin user.
# It must complete successfully before the main app Deployment starts.
# Re-run this Job after each DefectDojo version upgrade to apply new migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: defectdojo-initializer
  namespace: defectdojo
  labels:
    app: defectdojo-initializer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: defectdojo-initializer
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z 192.168.86.159 5432; do
                echo "Waiting for PostgreSQL..."; sleep 3
              done
      containers:
        - name: initializer
          image: defectdojo/defectdojo-django:latest
          imagePullPolicy: IfNotPresent
          # The defectdojo-django image ships /entrypoint-initializer.sh which
          # runs migrations and creates the initial admin account.
          entrypoint: ["/entrypoint-initializer.sh"]
          env:
            - name: DD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: DD_DATABASE_URL
            - name: DD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: DD_SECRET_KEY
            - name: DD_CREDENTIAL_AES_256_KEY
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: DD_CREDENTIAL_AES_256_KEY
            - name: DD_CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: DD_CELERY_BROKER_URL
            - name: DD_ADMIN_USER
              value: admin
            - name: DD_ADMIN_MAIL
              value: admin@defectdojo.local
            - name: DD_ADMIN_FIRST_NAME
              value: Admin
            - name: DD_ADMIN_LAST_NAME
              value: User
            - name: DD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: DD_ADMIN_PASSWORD
            - name: DD_INITIALIZE
              value: "True"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
