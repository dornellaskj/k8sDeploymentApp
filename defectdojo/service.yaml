apiVersion: v1
kind: Service
metadata:
  name: defectdojo
  namespace: defectdojo
  labels:
    app: defectdojo
spec:
  selector:
    app: defectdojo
  ports:
    - name: http
      port: 80
      targetPort: 8080
  # Change to ClusterIP and use an Ingress if you have an Ingress controller.
  type: LoadBalancer
