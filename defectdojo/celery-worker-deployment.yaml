# Celery Worker — processes async tasks such as deduplication and JIRA sync.
# Scale replicas to increase throughput for large Finding imports.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defectdojo-celery-worker
  namespace: defectdojo
  labels:
    app: defectdojo-celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: defectdojo-celery-worker
  template:
    metadata:
      labels:
        app: defectdojo-celery-worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z 192.168.86.159 5432; do
                echo "Waiting for PostgreSQL..."; sleep 3
              done
        - name: wait-for-valkey
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z defectdojo-valkey 6379; do
                echo "Waiting for Valkey..."; sleep 3
              done
      containers:
        - name: celery-worker
          image: defectdojo/defectdojo-django:latest
          imagePullPolicy: IfNotPresent
          entrypoint: ["/entrypoint-celery-worker.sh"]
          env:
            - name: DD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: DD_DATABASE_URL
            - name: DD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: DD_SECRET_KEY
            - name: DD_CREDENTIAL_AES_256_KEY
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: DD_CREDENTIAL_AES_256_KEY
            - name: DD_CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: defectdojo-secrets
                  key: DD_CELERY_BROKER_URL
            # Switch to prefork and tune the values below for higher throughput
            - name: DD_CELERY_WORKER_POOL_TYPE
              value: "solo"
          volumeMounts:
            - name: media
              mountPath: /app/media
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: defectdojo-media-pvc
